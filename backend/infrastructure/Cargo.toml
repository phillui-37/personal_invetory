[package]
name = "infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
domain = { path = "../domain" }
plugins = { path = "../plugins" }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "=1.8.0", default-features = false, features = ["v4"] }

[dev-dependencies]
futures = "0.3"
