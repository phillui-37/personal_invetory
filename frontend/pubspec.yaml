publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  archive: ^3.6.1
  file_picker: ^8.1.7
  syncfusion_flutter_pdf: ^26.2.14
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.7
  lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/frontend/js/
